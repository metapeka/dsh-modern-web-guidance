name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the package has zero dependencies, and the test script
      # is `node --test test/`, so a plain checkout is already runnable.
      - run: npm test

      # Publishing ships only the `files` entries; a dry run fails the build if
      # that manifest no longer matches what is actually in the tree.
      - name: Package contents
        run: npm pack --dry-run
