name: token check

# Temporary diagnostic. Prints no secret material: account name, token metadata, 2FA state.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Who am I
        run: |
          echo "token length: ${#NODE_AUTH_TOKEN}"
          echo "token prefix: ${NODE_AUTH_TOKEN:0:8}"
          npm whoami || echo "whoami failed with $?"

      - name: Token metadata
        run: |
          curl -s -H "Authorization: Bearer $NODE_AUTH_TOKEN" https://registry.npmjs.org/-/npm/v1/tokens \
            > /tmp/tokens.json
          node -e '
            const doc = JSON.parse(require("fs").readFileSync("/tmp/tokens.json", "utf8"));
            for (const t of doc.objects ?? []) {
              console.log(JSON.stringify({
                name: t.name,
                bypass_2fa: t.bypass_2fa,
                expiry: t.expiry,
                permissions: t.permissions,
              }));
            }
          '

      - name: Account profile and 2FA
        run: |
          npm profile get --json > /tmp/profile.json || echo "profile get failed: $?"
          node -e '
            const raw = require("fs").readFileSync("/tmp/profile.json", "utf8").trim();
            if (raw === "") { console.log("empty profile response"); process.exit(0); }
            const p = JSON.parse(raw);
            console.log(JSON.stringify({ tfa: p.tfa ?? null, tfa_mode: p.tfa_mode ?? null, name: p.name ?? null }));
          '

      - name: Registry listing
        run: |
          echo "--- npm view"
          npm view dsh-modern-web-guidance --json 2>&1 | head -c 1200; echo
          echo "--- registry document"
          curl -s https://registry.npmjs.org/dsh-modern-web-guidance | head -c 600; echo

      - name: Published versions (fresh)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm view dsh-modern-web-guidance versions --prefer-online --json 2>&1 | head -c 400; echo
          npm view dsh-modern-web-guidance dist-tags --prefer-online --json 2>&1 | head -c 300; echo
          echo "--- staged queue"
          npm stage list 2>&1 | head -c 600; echo
