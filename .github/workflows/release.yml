name: release

# Manual only. Everything it needs is an OIDC identity: no npm token, no repository secret.
# Configure the trusted publisher once on npmjs.com (package Settings -> Trusted publishing):
#   repository metapeka/dsh-modern-web-guidance, workflow release.yml, environment empty.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attach the tarball, but do not publish to npm
        type: boolean
        default: false

permissions:
  contents: write # create the GitHub release and upload the tarball
  id-token: write # OIDC token for `npm publish --provenance`

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5 or newer; the runner ships npm 10 with node 22.
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11

      # The same gate the tests workflow runs: never publish something unverified.
      - run: npm test

      - name: Read the version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already on the registry
        id: registry
        run: |
          if npm view "dsh-modern-web-guidance@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # npm refuses to create a package over OIDC: the name has to exist before a trusted
      # publisher can be attached to it (npm/documentation#1926). Until that first publish
      # happened, an `NPM_TOKEN` secret supplies the credential; with the secret absent the
      # OIDC path is used and no token is involved.
      - name: Publish with the one-off token
        if: steps.registry.outputs.published == 'false' && inputs.dry_run == false && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Publish with the trusted publisher
        if: steps.registry.outputs.published == 'false' && inputs.dry_run == false && env.NPM_TOKEN == ''
        run: npm publish --provenance --access public

      # A brand-new package shows a `0.0.0-stage` placeholder for a minute or two while npm
      # finishes creating it, so the registry is polled instead of read once.
      - name: Verify the published version
        if: steps.registry.outputs.published == 'false' && inputs.dry_run == false
        run: |
          for attempt in $(seq 1 20); do
            found=$(npm view "dsh-modern-web-guidance@${{ steps.version.outputs.value }}" version 2>/dev/null || true)
            if [ -n "$found" ]; then
              echo "registry now serves $found"
              exit 0
            fi
            echo "attempt $attempt: ${{ steps.version.outputs.value }} is not visible yet"
            sleep 15
          done
          echo "::error::${{ steps.version.outputs.value }} never appeared on the registry after five minutes"
          npm view dsh-modern-web-guidance versions --prefer-online --json || true
          npm stage list || true
          exit 1

      - name: Build the tarball
        run: |
          npm pack
          cp "$(ls dsh-modern-web-guidance-*.tgz)" dsh-modern-web-guidance.tgz

      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.value }}"
          notes="docs/releases/$tag.md"
          if [ -f "$notes" ]; then
            # Curated notes win: --generate-notes only lists merged PRs, so an unpulled
            # release would show nothing but the compare link.
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$tag" --notes-file "$notes"
            else
              gh release create "$tag" --title "$tag" --notes-file "$notes"
            fi
          else
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" dsh-modern-web-guidance.tgz --clobber
