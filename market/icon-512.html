<!doctype html>
<!-- Source for icon.png. Rasterise from the repo root with:
     chrome --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
       --default-background-color=00000000 --window-size=512,512 \
       --user-data-dir="$(mktemp -d)" --screenshot="$PWD/icon.png" "$PWD/market/icon-512.html"
     Use a fresh --user-data-dir every run: with a locked profile Chrome exits without writing
     the file and reports nothing. The transparent background keeps the SVG's rounded corners. -->
<html>
<head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  img { display: block; width: 512px; height: 512px; }
</style></head>
<body><img src="../icon.svg" width="512" height="512" alt=""></body>
</html>
